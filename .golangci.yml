version: "2"

# The default linter set (errcheck, govet, ineffassign, staticcheck, unused)
# is kept as-is. The only tuning is below, and it is a deliberate exemption
# rather than a preference.
linters:
  settings:
    errcheck:
      # Writes of diagnostics and results to the caller's stdout/stderr.
      # There is no recovery available at these call sites: rgit is already
      # reporting an outcome when it reaches them, and a second failure to
      # report the first one has nowhere to go. Go's runtime already turns
      # EPIPE on fd 1 or 2 into SIGPIPE, so the `rgit diff | head` case
      # terminates the process rather than silently losing output.
      #
      # Every other discarded error in this repo is written `_ =` at the
      # call site on purpose; see internal/lsp/dial.go for the best-effort
      # cleanup paths and the reasoning attached to each.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
  exclusions:
    rules:
      # SA1019 on InitializeParams.RootURI, which staticcheck reports as
      # deprecated "in favour of workspaceFolders". There is nothing to move
      # to: go.lsp.dev/protocol v1.0.1 is the latest published version, and
      # its InitializeParams carries no WorkspaceFolders field at all. The
      # LSP spec composes InitializeParams as _InitializeParams &
      # WorkspaceFoldersInitializeParams; this library generated the second
      # struct (workspace_features.gen.go) and never embedded it.
      #
      # Dropping the field is not the alternative it looks like. RootURI is
      # `json:"rootUri"` with no omitzero, so a nil value serializes as null
      # -- "no folder is open" -- which drops gopls, pyright and vtsls into
      # single-file mode and silently costs the cross-check its workspace.
      #
      # Scoped to the one call site, and temporary: the upstream fix is to
      # embed the struct the spec already pairs it with, after which rgit
      # sends workspaceFolders and this exclusion goes away.
      - path: internal/lsp/client\.go
        linters:
          - staticcheck
        text: SA1019

issues:
  # Report every occurrence. golangci-lint otherwise caps repeats of one
  # message at 3 and one linter at 50, which silently turns a real count
  # into a much smaller one -- a gate that under-reports is a gate that
  # hides the finding it exists to surface.
  max-issues-per-linter: 0
  max-same-issues: 0
