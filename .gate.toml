# One race compile of the cgo grammars, then lint / test / vuln in parallel.
# They wait on a stamp in GOCACHE so they do not start a second compile beside
# build. Gitleaks, actionlint, and shellcheck need no Go cache and overlap
# the build.
[gates.gitleaks]
run = "gitleaks detect --no-banner --redact"

[gates.build]
run = "cache=$(go env GOCACHE); rm -f \"$cache/rgit-gate-ready\" \"$cache/rgit-gate-fail\"; go build -race ./...; e=$?; if [ \"$e\" -eq 0 ]; then touch \"$cache/rgit-gate-ready\"; else touch \"$cache/rgit-gate-fail\"; fi; exit \"$e\""

[gates.lint]
run = "cache=$(go env GOCACHE); while [ ! -f \"$cache/rgit-gate-ready\" ] && [ ! -f \"$cache/rgit-gate-fail\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready\" ] && make lint"
env = { GOFLAGS = "-race" }

[gates.test]
run = "cache=$(go env GOCACHE); while [ ! -f \"$cache/rgit-gate-ready\" ] && [ ! -f \"$cache/rgit-gate-fail\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready\" ] && go test -race -short ./..."

[gates.vuln]
run = "cache=$(go env GOCACHE); while [ ! -f \"$cache/rgit-gate-ready\" ] && [ ! -f \"$cache/rgit-gate-fail\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready\" ] && govulncheck ./..."
env = { GOFLAGS = "-race" }
