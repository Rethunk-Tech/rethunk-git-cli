# One race compile of the cgo grammars, then lint / test / vuln / cross in parallel.
# They wait on a stamp in GOCACHE suffixed with the gate run pid, so a previous run's flag is never read so they do not start a second compile beside
# build. Gitleaks, actionlint, and shellcheck need no Go cache and overlap
# the build.
[gates.gitleaks]
run = "[ -n \"$CI\" ] || gitleaks detect --no-banner --redact"

[gates.build]
timeout = "5m"
run = "cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; find \"$cache\" -maxdepth 1 -name 'rgit-gate-*' -mmin +60 -delete; rm -f \"$cache/rgit-gate-ready.$t\" \"$cache/rgit-gate-fail.$t\"; go build -race ./...; e=$?; if [ \"$e\" -eq 0 ]; then touch \"$cache/rgit-gate-ready.$t\"; else touch \"$cache/rgit-gate-fail.$t\"; fi; exit \"$e\""

[gates.lint]
timeout = "5m"
run = "cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; while [ ! -f \"$cache/rgit-gate-ready.$t\" ] && [ ! -f \"$cache/rgit-gate-fail.$t\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready.$t\" ] && make lint"
env = { GOFLAGS = "-race" }

[gates.test]
timeout = "5m"
run = "cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; while [ ! -f \"$cache/rgit-gate-ready.$t\" ] && [ ! -f \"$cache/rgit-gate-fail.$t\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready.$t\" ] && go test -race -short ./..."

[gates.vuln]
timeout = "5m"
run = "cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; while [ ! -f \"$cache/rgit-gate-ready.$t\" ] && [ ! -f \"$cache/rgit-gate-fail.$t\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready.$t\" ] && govulncheck ./..."
env = { GOFLAGS = "-race" }

[gates.xcheck]
timeout = "5m"
run = "cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; while [ ! -f \"$cache/rgit-gate-ready.$t\" ] && [ ! -f \"$cache/rgit-gate-fail.$t\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready.$t\" ] && go vet -tags rgit_xcheck ./cmd/xcheck/..."

# CI cross-compiles in its own job with zig installed; the unit lane has no zig.
[gates.cross]
timeout = "5m"
run = "[ \"${GITHUB_ACTIONS:-}\" = true ] && exit 0; cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; while [ ! -f \"$cache/rgit-gate-ready.$t\" ] && [ ! -f \"$cache/rgit-gate-fail.$t\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready.$t\" ] && { [ -f internal/resolve/sqlgrammar/csrc/parser.c ] || make sql-parser; } && make -o sql-parser cross"

# CI's `full` job: the whole tree without -short, so the e2e cases and the live
# gopls / rust-analyzer / marksman / zsh cases run. e2e: it needs those servers
# installed and adds about 15 s to a gate that budgets under 10 s warm.
[gates.test-full]
e2e = true
timeout = "10m"
run = "cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; while [ ! -f \"$cache/rgit-gate-ready.$t\" ] && [ ! -f \"$cache/rgit-gate-fail.$t\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready.$t\" ] && go test -race ./..."

# CI's `full` job SQL lane (rgit_sql). e2e: it needs the generated SQL parser
# (tree-sitter-cli, `make sql-parser`) and about 20 s of extra cgo compile.
[gates.test-sql]
e2e = true
timeout = "10m"
run = "cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; while [ ! -f \"$cache/rgit-gate-ready.$t\" ] && [ ! -f \"$cache/rgit-gate-fail.$t\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready.$t\" ] && { [ -f internal/resolve/sqlgrammar/csrc/parser.c ] || make sql-parser; } && go test -tags rgit_sql -short ./..."

# CI's `xcheck` job: every grammar against its live language server, strict.
# e2e: it fails unless every server (gopls, rust-analyzer, marksman, vtsls, zsh
# and the rest) is installed, which only this workstation and CI guarantee.
[gates.xcheck-lsp]
e2e = true
timeout = "5m"
run = "cache=$(go env GOCACHE); t=${GATE_ACTIVE_RUN%% *}; while [ ! -f \"$cache/rgit-gate-ready.$t\" ] && [ ! -f \"$cache/rgit-gate-fail.$t\" ]; do sleep 0.05; done; [ -f \"$cache/rgit-gate-ready.$t\" ] && make xcheck"

# CI's `install-script` job: dry-run and mocked-network cases, no download.
[gates.install-script]
timeout = "1m"
run = "sh scripts/test-install.sh"
