name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push that supersedes an in-flight run makes that run's verdict
# irrelevant, so cancel it rather than paying for both. Keyed by ref, so
# concurrent PRs never cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # GitHub removes the Node 20 action runtime on 2026-09-16. mlugg/setup-zig still declares
  # `using: node20` at its own latest release, so there is no version to upgrade to. This
  # forces the post-cutover runtime now, on ordinary CI runs, rather than discovering on the
  # 16th whether the action works under node24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# No SQL lane here on purpose: any target that builds or tests SQL must
# delegate to cmd/rgit-install, so -tags rgit_sql and parser generation stay
# in exactly one place (AGENTS.md § Delegation boundary). Plain `go build`/
# `go test` never touch it.
#
# cgo is mandatory -- rgit links tree-sitter through cgo, so CGO_ENABLED=0
# is not an option. ubuntu-latest ships gcc (verified against
# actions/runner-images' own software manifest), so no toolchain step is
# needed here.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-go@68f159b435d9b129b8baf36436079c3e76fb3222 # v1.11
        with:
          run-lint: "true"
          run-govulncheck: "true"

  unit:
    name: test (unit lane, -short)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-go@68f159b435d9b129b8baf36436079c3e76fb3222 # v1.11
      # The unit lane is where the guarantee lives (CONTRIBUTING.md § Tests):
      # a regression must fail here. -short skips only the built-binary
      # end-to-end file and the live-server cross-checks, so this job
      # enforces that every other test passes without them.
      - run: go test -short ./...

  e2e:
    name: test (full suite)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-go@68f159b435d9b129b8baf36436079c3e76fb3222 # v1.11
      # cmd/rgit-install's own tests (TestRunPrereqChecks, TestFindSQLAdapter)
      # assert tree-sitter's PATH presence for the prereq check itself -- not
      # a build-time SQL lane (this file's own top comment).
      - run: npm install -g tree-sitter-cli
      # The -short lane runs as its own job (see above); this run executes
      # everything, plus the end-to-end cases that build and exec the
      # binary. Live server and completion cases guard on exec.LookPath
      # and skip cleanly when a server or shell (zsh here) is absent from
      # the runner.
      - run: go test ./...

  race:
    name: race (full tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-go@68f159b435d9b129b8baf36436079c3e76fb3222 # v1.11
      # Full tree, not just internal/lsp: jsonrpc2 and the spawn lock live
      # there (CONTRIBUTING.md § Tests), but internal/diff and internal/gitx
      # hold concurrent paths of their own, so a scoped race run stopped
      # proving anything about the rest. The suite stays <=30s unraced, so
      # the raced run still fits this timeout. Every live-server case skips
      # cleanly via its own exec.LookPath guard when nothing is installed.
      - run: go test -race ./...

  # Every other Go job here builds for linux/amd64 only, so without this one
  # the published linux/arm64 and windows binaries would first be compiled
  # at tag time, in release.yml -- a break there fails the release rather
  # than the pull request that caused it. internal/lsp/owner_windows.go, the socket
  # ownership check guarding LSP dial, has no other job that compiles it at
  # all. Compile-only on purpose: running the suite on either platform is a
  # separate question (the chmod/symlink cases would need skips first), and
  # a link failure is the class of break these targets actually hit.
  #
  # One job rather than a job per target: runners bill each job
  # rounded up to the whole minute, so parallel legs would pay the setup
  # floor once per target. The speed comes from caching instead:
  #
  # - The generated SQL parser is a pure function of cmd/rgit-install
  #   (which pins the grammar version) and the tree-sitter CLI release, so
  #   it is cached on exactly those and regenerated (~60s) only when either
  #   changes. The CLI version is resolved rather than pinned so it stays
  #   latest. Without the CLI the build still succeeds, just SQL-less, and
  #   this job would never compile the SQL grammar the release ships.
  # - GOCACHE gets a cache of its own, outside the one setup-go shares across
  #   every job under a single key: the cgo grammars (the SQL parser alone is
  #   17 MB of C) compile once per target and are reused until go.sum or the
  #   generated parser changes. Go keys entries by GOOS/GOARCH/CC, so every
  #   target in the job shares the one directory.
  # - `-o sql-parser` stops `make cross` regenerating a parser the cache (or
  #   the step before) already produced; -j builds the targets side by side
  #   on the runner's cores.
  cross-compile:
    name: cross-compile (linux, windows)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-go@68f159b435d9b129b8baf36436079c3e76fb3222 # v1.11
      # Same toolchain release.yml drives: rgit links tree-sitter through
      # cgo, so every target needs a real C compiler (docs/INSTALL.md § Cross
      # builds). setup-zig caches zig's global cache itself.
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      - name: resolve tree-sitter CLI version
        id: tscli
        run: echo "version=$(npm view tree-sitter-cli version)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: sql-csrc
        with:
          path: internal/resolve/sqlgrammar/csrc
          key: sql-csrc-${{ runner.os }}-${{ steps.tscli.outputs.version }}-${{ hashFiles('cmd/rgit-install/**', '!cmd/rgit-install/*_test.go') }}
      - if: steps.sql-csrc.outputs.cache-hit != 'true'
        env:
          TSCLI_VERSION: ${{ steps.tscli.outputs.version }}
        run: npm install -g "tree-sitter-cli@$TSCLI_VERSION" && make sql-parser
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/go-build
          key: go-build-cross-${{ runner.os }}-${{ steps.tscli.outputs.version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-build-cross-${{ runner.os }}-
      - env:
          GOCACHE: ${{ runner.temp }}/go-build
        run: make -j3 -o sql-parser cross

  # The cross-check is the one thing no other job exercises: every grammar
  # measured against its own language server, on a corpus carrying the shapes
  # that have actually broken. It found both a pyright convention difference
  # that made multi-line Python bindings unstageable and a CSS grouped-selector
  # defect, neither of which any unit test saw -- because both were
  # disagreements between rgit and a real server, not within rgit.
  #
  # The only CI job depending on external npm and Go tooling, which is why it
  # is separate: its failure means "grammar and server drifted", not "the
  # build is broken".
  xcheck:
    name: lsp cross-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pinned to the version docs/INSTALL.md names, so a gopls release cannot
      # change what this job measures without the table changing too.
      GOPLS_VERSION: v0.23.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Rethunk-Tech/gh-actions/setup-go@68f159b435d9b129b8baf36436079c3e76fb3222 # v1.11
        id: go

      # Compiling gopls is ~40s; the binary depends only on its own version
      # and the Go release that builds it, so it is cached on those two.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: gopls
        with:
          path: ~/go/bin/gopls
          key: gopls-${{ env.GOPLS_VERSION }}-${{ runner.os }}-go${{ steps.go.outputs.go-version }}
      - if: steps.gopls.outputs.cache-hit != 'true'
        run: go install "golang.org/x/tools/gopls@$GOPLS_VERSION"

      # rust-analyzer ships as a rustup component, not on npm; the runner
      # already has a Rust toolchain.
      - run: rustup component add rust-analyzer

      # vscode-langservers-extracted supplies the json, css and html servers
      # from one package (docs/INSTALL.md § Language servers). Each is
      # resolved to its current release first and the cache keyed on those
      # versions (plus node's), so the servers stay latest while an
      # unchanged set restores from a private npm prefix instead of
      # reinstalling.
      - name: resolve language server versions
        id: lsp
        shell: bash
        run: |
          prefix="$RUNNER_TEMP/npm-global"
          echo "NPM_CONFIG_PREFIX=$prefix" >> "$GITHUB_ENV"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          for p in @vtsls/language-server pyright bash-language-server yaml-language-server vscode-langservers-extracted; do
            v=$(npm view "$p" version)
            printf '%s@%s\n' "$p" "$v"
          done > "$RUNNER_TEMP/lsp-packages.txt"
          cat "$RUNNER_TEMP/lsp-packages.txt"
          echo "key=node$(node --version)-$(sha256sum "$RUNNER_TEMP/lsp-packages.txt" | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: lsp-cache
        with:
          path: ${{ runner.temp }}/npm-global
          key: lsp-servers-${{ runner.os }}-${{ steps.lsp.outputs.key }}
      - if: steps.lsp-cache.outputs.cache-hit != 'true'
        run: xargs npm i -g < "$RUNNER_TEMP/lsp-packages.txt"

      # marksman publishes no package; the release binary is the only route.
      - name: install marksman
        run: |
          curl -fsSL -o /usr/local/bin/marksman \
            https://github.com/artempyanykh/marksman/releases/latest/download/marksman-linux-x64
          chmod +x /usr/local/bin/marksman

      # Fails the job rather than reporting a smaller table: a run that
      # silently skipped a server measures nothing about that language.
      - run: make xcheck

  install-script:
    name: install script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # shellcheck ships preinstalled on ubuntu-latest (actions/runner-images'
      # own software manifest) -- no extra Action or install step needed, the
      # same reasoning this file's own top comment gives for skipping a gcc
      # setup step.
      - run: shellcheck scripts/install.sh
      # --dry-run never touches the network (docs/INSTALL.md § Install
      # script): this is a lint of the script's own control flow -- flag
      # parsing, OS/arch detection, the printed plan -- not a real download,
      # so it needs nothing from the release it would otherwise fetch.
      - run: VERSION=v1.2.0 sh scripts/install.sh --dry-run
      - name: Show cosign plan in dry-run
        run: |
          mock_bin="$(mktemp -d)"
          trap 'rm -rf "$mock_bin"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            'exit 0' >"$mock_bin/cosign"
          chmod +x "$mock_bin/cosign"
          output="$(
            PATH="$mock_bin:/usr/bin:/bin" VERSION=v1.2.0 \
              sh scripts/install.sh --dry-run
          )"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq 'cosign/Sigstore bundle' || {
            printf '%s\n' 'missing cosign/Sigstore dry-run plan' >&2
            exit 1
          }
      # No darwin binaries are published, so the script must refuse Darwin
      # up front with a reason rather than 404 partway through a download.
      - name: Refuse Darwin without network
        run: |
          mock_bin="$(mktemp -d)"
          trap 'rm -rf "$mock_bin"' EXIT
          printf '%s\n' \
            '#!/bin/sh' \
            "case \"\$1\" in" \
            '  -s) printf "%s\n" Darwin ;;' \
            '  -m) printf "%s\n" arm64 ;;' \
            'esac' >"$mock_bin/uname"
          chmod +x "$mock_bin/uname"
          if output="$(
            PATH="$mock_bin:$PATH" VERSION=v1.2.0 sh scripts/install.sh --dry-run 2>&1
          )"; then
            printf '%s\n' "$output"
            printf '%s\n' 'install.sh accepted Darwin' >&2
            exit 1
          fi
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq 'no macOS binaries are published' || {
            printf '%s\n' 'missing Darwin refusal message' >&2
            exit 1
          }
      - name: Verify optional cosign branch without network
        run: |
          fixture="$(mktemp -d)"
          mock_bin="$(mktemp -d)"
          no_cosign_prefix="$(mktemp -d)"
          cosign_prefix="$(mktemp -d)"
          cosign_marker="$(mktemp)"
          trap 'rm -rf "$fixture" "$mock_bin" "$no_cosign_prefix" "$cosign_prefix" "$cosign_marker"' EXIT
          asset="rgit-v1.2.0-linux-amd64"
          printf '%s\n' \
            '#!/bin/sh' \
            'printf "%s\n" "rgit v1.2.0"' >"$fixture/$asset"
          chmod +x "$fixture/$asset"
          asset_digest="$(sha256sum "$fixture/$asset" | cut -d' ' -f1)"
          printf '%s  %s\n' "$asset_digest" "$asset" >"$fixture/SHA256SUMS"
          printf '%s\n' '{"mock":true}' >"$fixture/SHA256SUMS.sigstore.json"
          export COSIGN_FIXTURE="$fixture"
          export COSIGN_MARKER="$cosign_marker"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            'out=' \
            'url=' \
            "while [ \"\$#\" -gt 0 ]; do" \
            "  case \"\$1\" in" \
            "    -o) out=\$2; shift 2 ;;" \
            '    -*) shift ;;' \
            "    *) url=\$1; shift ;;" \
            '  esac' \
            'done' \
            "case \"\$url\" in" \
            "  */SHA256SUMS.sigstore.json) cp \"\$COSIGN_FIXTURE/SHA256SUMS.sigstore.json\" \"\$out\" ;;" \
            "  */SHA256SUMS) cp \"\$COSIGN_FIXTURE/SHA256SUMS\" \"\$out\" ;;" \
            "  */rgit-v1.2.0-linux-amd64) cp \"\$COSIGN_FIXTURE/rgit-v1.2.0-linux-amd64\" \"\$out\" ;;" \
            '  *) exit 1 ;;' \
            'esac' >"$mock_bin/curl"
          chmod +x "$mock_bin/curl"
          PATH="$mock_bin:/usr/bin:/bin" \
            PREFIX="$no_cosign_prefix" VERSION=v1.2.0 \
            sh scripts/install.sh
          test ! -s "$cosign_marker"
          printf '%s\n' \
            '#!/bin/sh' \
            'set -eu' \
            "[ \"\${1:-}\" = verify-blob ]" \
            'shift' \
            'bundle=' \
            'identity=' \
            'issuer=' \
            'checksum=' \
            "while [ \"\$#\" -gt 0 ]; do" \
            "  case \"\$1\" in" \
            "    --bundle) bundle=\$2; shift 2 ;;" \
            "    --certificate-identity-regexp) identity=\$2; shift 2 ;;" \
            "    --certificate-oidc-issuer) issuer=\$2; shift 2 ;;" \
            "    *) checksum=\$1; shift ;;" \
            '  esac' \
            'done' \
            "[ \"\$bundle\" = SHA256SUMS.sigstore.json ]" \
            "[ \"\$checksum\" = SHA256SUMS ]" \
            "[ \"\$identity\" = \"https://github.com/Rethunk-Tech/rethunk-git-cli/.github/workflows/release.yml@.*\" ]" \
            "[ \"\$issuer\" = \"https://token.actions.githubusercontent.com\" ]" \
            "test -s \"\$bundle\"" \
            "test -s \"\$checksum\"" \
            "printf \"%s\n\" verified >\"\$COSIGN_MARKER\"" >"$mock_bin/cosign"
          chmod +x "$mock_bin/cosign"
          PATH="$mock_bin:/usr/bin:/bin" \
            PREFIX="$cosign_prefix" VERSION=v1.2.0 \
            sh scripts/install.sh
          grep -Fqx verified "$cosign_marker"
  install-script-windows:
    name: install script (windows)
    runs-on: windows-latest
    timeout-minutes: 5
    env:
      VERSION: v1.2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify Windows dry-run output
        shell: pwsh
        run: |
          $mockBin = Join-Path $env:RUNNER_TEMP "rgit-cosign-dry-run-$([guid]::NewGuid().ToString('N'))"
          New-Item -ItemType Directory -Path $mockBin | Out-Null
          try {
            Set-Content -LiteralPath (Join-Path $mockBin 'cosign.cmd') `
              -Value @('@echo off', 'exit /b 0') -Encoding ascii
            $oldPath = $env:PATH
            $env:PATH = "$mockBin;$oldPath"
            $outputLines = @(& .\scripts\install.ps1 -DryRun)
          } finally {
            $env:PATH = $oldPath
            Remove-Item -LiteralPath $mockBin -Recurse -Force -ErrorAction SilentlyContinue
          }
          if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $output = $outputLines -join [Environment]::NewLine
          $output
          foreach ($expected in @(
              'rgit-v1.2.0-windows-amd64.exe',
              'SHA256SUMS',
              'cosign/Sigstore bundle'
          )) {
            if (-not $output.Contains($expected)) {
              throw "missing expected output: $expected"
            }
          }
      - name: Verify optional cosign branch without network
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "rgit-install-fixture-$([guid]::NewGuid().ToString('N'))"
          $mockBin = Join-Path $env:RUNNER_TEMP "rgit-cosign-$([guid]::NewGuid().ToString('N'))"
          $noCosignBin = Join-Path $env:RUNNER_TEMP "rgit-no-cosign-$([guid]::NewGuid().ToString('N'))"
          $noCosignPrefix = Join-Path $env:RUNNER_TEMP "rgit-no-cosign-prefix-$([guid]::NewGuid().ToString('N'))"
          $cosignPrefix = Join-Path $env:RUNNER_TEMP "rgit-cosign-prefix-$([guid]::NewGuid().ToString('N'))"
          $marker = Join-Path $env:RUNNER_TEMP "rgit-cosign-marker-$([guid]::NewGuid().ToString('N'))"
          $asset = 'rgit-v1.2.0-windows-amd64.exe'

          foreach ($directory in @(
              $fixture,
              $mockBin,
              $noCosignBin,
              $noCosignPrefix,
              $cosignPrefix
          )) {
            New-Item -ItemType Directory -Path $directory | Out-Null
          }
          [IO.File]::WriteAllText($marker, '')
          Copy-Item -LiteralPath (Join-Path $env:SystemRoot 'System32\where.exe') `
            -Destination (Join-Path $fixture $asset)
          $digest = (Get-FileHash -LiteralPath (Join-Path $fixture $asset) -Algorithm SHA256).Hash
          Set-Content -LiteralPath (Join-Path $fixture 'SHA256SUMS') `
            -Value "$digest  $asset" -Encoding ascii
          Set-Content -LiteralPath (Join-Path $fixture 'SHA256SUMS.sigstore.json') `
            -Value '{"mock":true}' -Encoding ascii

          function Invoke-WebRequest {
            param(
              [string]$Uri,
              [string]$OutFile
            )
            $name = [IO.Path]::GetFileName(([Uri]$Uri).AbsolutePath)
            Copy-Item -LiteralPath (Join-Path $env:COSIGN_FIXTURE $name) `
              -Destination $OutFile -Force
          }

          $cosignScript = @(
            '@echo off'
            'if /i not "%~1"=="verify-blob" exit /b 1'
            'if /i not "%~2"=="--bundle" exit /b 1'
            'if /i not "%~nx3"=="SHA256SUMS.sigstore.json" exit /b 1'
            'if not exist "%~3" exit /b 1'
            'if /i not "%~4"=="--certificate-identity-regexp" exit /b 1'
            'if not "%~5"=="https://github.com/Rethunk-Tech/rethunk-git-cli/.github/workflows/release.yml@.*" exit /b 1'
            'if /i not "%~6"=="--certificate-oidc-issuer" exit /b 1'
            'if not "%~7"=="https://token.actions.githubusercontent.com" exit /b 1'
            'if /i not "%~nx8"=="SHA256SUMS" exit /b 1'
            'if not exist "%~8" exit /b 1'
            '> "%COSIGN_MARKER%" echo verified'
            'exit /b 0'
          )
          Set-Content -LiteralPath (Join-Path $mockBin 'cosign.cmd') `
            -Value $cosignScript -Encoding ascii

          $oldPath = $env:PATH
          try {
            $env:COSIGN_FIXTURE = $fixture
            $env:COSIGN_MARKER = $marker

            $env:PATH = $noCosignBin
            $env:PREFIX = $noCosignPrefix
            & .\scripts\install.ps1
            if (-not (Test-Path -LiteralPath (Join-Path $noCosignPrefix 'rgit.exe'))) {
              throw 'Windows install without cosign did not produce rgit.exe'
            }
            if ((Get-Item -LiteralPath $marker).Length -ne 0) {
              throw 'cosign marker was written on the no-cosign path'
            }

            $env:PATH = "$mockBin;$env:SystemRoot\System32"
            $env:PREFIX = $cosignPrefix
            & .\scripts\install.ps1
            if (-not (Test-Path -LiteralPath (Join-Path $cosignPrefix 'rgit.exe'))) {
              throw 'Windows install with cosign did not produce rgit.exe'
            }
            if ((Get-Content -LiteralPath $marker -Raw).Trim() -ne 'verified') {
              throw 'cosign marker was not written by the cosign path'
            }
          } finally {
            $env:PATH = $oldPath
            $env:PREFIX = $null
            Remove-Item -LiteralPath @(
              $fixture,
              $mockBin,
              $noCosignBin,
              $noCosignPrefix,
              $cosignPrefix,
              $marker
            ) -Recurse -Force -ErrorAction SilentlyContinue
          }
